<!DOCTYPE html>
<!--
  RepoSweep report — a single self-contained file. All CSS/JS inline, no CDN,
  no build step. Open offline or copy to docs/ to publish on GitHub Pages.
  Generated by report.sh; DATA and META below are injected from the run.
  Propose-only: every bin is a suggestion, nothing was written back to the tracker.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoSweep report</title>
<style>
  :root {
    --bg:#f6f7f9; --panel:#fff; --ink:#1f2430; --muted:#6b7280; --line:#e4e7ec;
    --line2:#eef1f4; --chip:#f1f3f6; --accent:#4338ca; --due:#dc2626; --ok:#16a34a;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { font-family:var(--sans); color:var(--ink); background:var(--bg); font-size:14px; line-height:1.45; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  code,.mono { font-family:var(--mono); }

  .banner { background:var(--panel); border-bottom:1px solid var(--line); padding:14px 20px; }
  .banner-row { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; max-width:1400px; margin:0 auto; }
  .banner h1 { font-size:17px; margin:0; font-weight:650; }
  .banner .sub { color:var(--muted); font-size:12.5px; }
  .banner .sub .mono { color:var(--ink); }

  .health { max-width:1400px; margin:12px auto 0; display:flex; gap:22px; flex-wrap:wrap; align-items:center; }
  .health .headline { font-size:13.5px; }
  .health .headline b { font-variant-numeric:tabular-nums; }
  .bar { width:280px; height:10px; border-radius:999px; background:var(--line); overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--due); }
  .compo { font-size:12.5px; color:var(--muted); }
  .totals { display:flex; gap:6px; flex-wrap:wrap; margin:10px auto 0; max-width:1400px; }
  .total-pill { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px;
    background:var(--chip); font-size:12px; border:1px solid var(--line); }
  .total-pill b { font-variant-numeric:tabular-nums; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; }

  .wrap { max-width:1400px; margin:0 auto; padding:16px 20px 90px; }
  .queue { display:grid; grid-template-columns:250px 1fr; gap:18px; align-items:start; }
  @media (max-width:820px) { .queue { grid-template-columns:1fr; } .side { position:static; } }
  .side { position:sticky; top:16px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; box-shadow:var(--shadow); padding:12px; }
  .side h3 { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 6px; }
  .side h3:first-of-type { margin-top:6px; }
  .search { width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:#fff; margin-bottom:4px; }
  .frow { display:flex; align-items:center; gap:8px; padding:3px 4px; border-radius:6px; cursor:pointer; font-size:13px; }
  .frow:hover { background:var(--line2); }
  .frow input { accent-color:var(--accent); }
  .frow .fc { margin-left:auto; color:var(--muted); font-size:11.5px; font-variant-numeric:tabular-nums; }
  .frow .dot { margin:0; }
  .clearbtn { margin-top:12px; width:100%; padding:6px; border:1px solid var(--line); background:#fff;
    border-radius:7px; font-size:12px; cursor:pointer; color:var(--muted); }

  .facet { font-size:10.5px; padding:1px 6px; border-radius:4px; background:var(--chip); color:var(--muted);
    border:1px solid var(--line); white-space:nowrap; text-transform:uppercase; letter-spacing:.02em; }
  .facet.bug { background:#fef2f2; color:#b91c1c; border-color:#fecaca; }
  .facet.feature { background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }
  .facet.docs { background:#f0fdf4; color:#15803d; border-color:#bbf7d0; }
  .facet.gfi { background:#fdf4ff; color:#a21caf; border-color:#f5d0fe; }
  .facet.pr { background:#ecfeff; color:#0e7490; border-color:#a5f3fc; }
  .facet.draft { background:#f8fafc; color:#475569; border-color:#cbd5e1; }
  .facet.bot { background:#fffbeb; color:#b45309; border-color:#fde68a; }
  .facet.conflicted { background:#fef2f2; color:#b91c1c; border-color:#fecaca; }
  .facet.healthy { background:#f0fdf4; color:#15803d; border-color:#bbf7d0; }
  .num { font-family:var(--mono); color:var(--muted); font-size:12px; }
  .binbadge { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; }

  .grp { margin-bottom:16px; }
  .grp-h { display:flex; align-items:center; gap:8px; padding:6px 2px; border-bottom:2px solid var(--c); margin-bottom:6px; }
  .grp-h .binbadge { color:var(--c); font-size:13.5px; }
  .grp-h .cnt { color:var(--muted); font-size:12px; }
  .qitem { background:var(--panel); border:1px solid var(--line); border-radius:9px; margin-bottom:7px; }
  .qitem-h { padding:9px 12px; display:flex; gap:8px; align-items:center; cursor:pointer; }
  .qitem-h .ttl { font-weight:550; }
  .qitem-h .age { margin-left:auto; color:var(--muted); font-size:11.5px; white-space:nowrap; }
  .qitem-body { display:none; padding:0 12px 12px 12px; color:#374151; }
  .qitem.open .qitem-body { display:block; }
  .qitem .rat { border-top:1px dashed var(--line); padding-top:9px; }
  .qitem .line { margin-top:8px; font-size:12.5px; }
  .rule { font-family:var(--mono); font-size:11px; color:var(--muted); }
  .duegc { color:var(--due); font-weight:600; }
  .dupgroup { border-left:3px solid #f9a8d4; padding-left:10px; margin:6px 0 10px; }
  .dupgroup .caption { font-size:11.5px; color:#be185d; margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em; }
  .empty { color:var(--muted); padding:30px; text-align:center; }
</style>
</head>
<body>

<div class="banner">
  <div class="banner-row">
    <h1>RepoSweep — <span class="mono" id="s-repo"></span></h1>
    <span class="sub">run <span class="mono" id="s-run"></span> · <span class="mono" id="s-count"></span> open items swept · propose-only, nothing written back</span>
  </div>
  <div class="health">
    <span class="headline">Stale pressure: <b id="h-due"></b> of <b id="h-total"></b> past due</span>
    <span class="bar"><i id="h-bar"></i></span>
    <span class="compo" id="h-compo"></span>
  </div>
  <div class="totals" id="totals"></div>
</div>

<div class="wrap">
  <div class="queue">
    <aside class="side" id="side"></aside>
    <div id="main"></div>
  </div>
</div>

<script>
const DATA =
//__REPOSWEEP_DATA__
;
const META =
//__REPOSWEEP_META__
;

const BINS = [
  { key:'ready-for-agent',    label:'Ready for agent',    color:'#7c3aed' },
  { key:'ready-for-human',    label:'Ready for human',    color:'#2563eb' },
  { key:'needs-rebase',       label:'Needs rebase',       color:'#d97706' },
  { key:'flag-for-review',    label:'Flag for review',    color:'#0891b2' },
  { key:'needs-info',         label:'Needs info',         color:'#ca8a04' },
  { key:'possible-duplicate', label:'Possible duplicate', color:'#db2777' },
  { key:'close-as-stale',     label:'Close as stale',     color:'#dc2626' },
  { key:'wontfix',            label:'Wontfix',            color:'#6b7280' },
  { key:'needs-triage',       label:'Needs triage',       color:'#64748b' },
];
const BINMAP = Object.fromEntries(BINS.map(b => [b.key, b]));
const T = META.thresholds || {};
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// Queued work (ready-for-*) is exempt from staleness; needs-info issues use the
// shorter window. These mirror the classifier so the banner agrees with the bins.
const isQueued = i => (i.labels || []).some(l => l === 'ready-for-agent' || l === 'ready-for-human');
const windowFor = i => (i.kind === 'issue' && (i.labels || []).indexOf('needs-info') >= 0) ? T.NEEDS_INFO_DAYS : T.STALE_DAYS;
const pastDue = i => i.idle != null && i.idle > windowFor(i) && !isQueued(i);
const byBin = k => DATA.filter(i => i.bin === k);

/* ---- banner: counts, health, composition ---- */
document.getElementById('s-repo').textContent = META.repo || '';
document.getElementById('s-run').textContent = META.swept_at || META.run_id || '';
document.getElementById('s-count').textContent = DATA.length;
(function health(){
  const due = DATA.filter(pastDue).length, total = DATA.length;
  document.getElementById('h-due').textContent = due;
  document.getElementById('h-total').textContent = total;
  document.getElementById('h-bar').style.width = total ? (100 * due / total) + '%' : '0%';
  const iss = DATA.filter(i => i.kind === 'issue').length, prs = DATA.filter(i => i.kind === 'pr').length;
  document.getElementById('h-compo').textContent = `${iss} issue${iss===1?'':'s'} · ${prs} PR${prs===1?'':'s'}`;
})();
(function totals(){
  const t = document.getElementById('totals');
  BINS.forEach(b => { const n = byBin(b.key).length; if (!n) return;
    const el = document.createElement('span'); el.className = 'total-pill';
    el.innerHTML = `<span class="dot" style="background:${b.color}"></span><span>${b.label}</span><b>${n}</b>`;
    t.appendChild(el);
  });
})();

/* ---- facet chips ---- */
function facets(i) {
  const f = [];
  f.push(`<span class="facet ${i.kind==='pr'?'pr':''}">${i.kind==='pr'?'PR':'ISSUE'}</span>`);
  if (i.type) f.push(`<span class="facet ${i.type}">${esc(i.type)}</span>`);
  if ((i.flags||[]).indexOf('good-first-issue') >= 0) f.push(`<span class="facet gfi">good-first</span>`);
  if (i.is_draft) f.push(`<span class="facet draft">draft</span>`);
  if (i.is_bot) f.push(`<span class="facet bot">bot</span>`);
  if (i.conflicted) f.push(`<span class="facet conflicted">conflicted</span>`);
  if (i.long_lived) f.push(`<span class="facet">long-lived</span>`);
  if ((i.flags||[]).indexOf('healthy') >= 0) f.push(`<span class="facet healthy">healthy</span>`);
  if (i.kind==='pr' && i.size) f.push(`<span class="facet">size/${esc(i.size)}</span>`);
  return f.join('');
}

/* ---- faceted queue ---- */
const state = { bins:new Set(), kinds:new Set(), facets:new Set(), term:'' };
const side = document.getElementById('side');
const main = document.getElementById('main');

(function sidebar(){
  let h = `<input class="search" id="q" placeholder="Search title, #number, author, rationale…">`;
  h += `<h3>Outcome bin</h3>`;
  BINS.forEach(b => { const n = byBin(b.key).length; if (!n) return;
    h += `<label class="frow"><input type="checkbox" data-g="bins" value="${b.key}"><span class="dot" style="background:${b.color}"></span>${b.label}<span class="fc">${n}</span></label>`;
  });
  h += `<h3>Kind</h3>`;
  [['issue','Issues'],['pr','Pull requests']].forEach(([k,lab]) => { const n = DATA.filter(i=>i.kind===k).length; if(!n) return;
    h += `<label class="frow"><input type="checkbox" data-g="kinds" value="${k}">${lab}<span class="fc">${n}</span></label>`;
  });
  h += `<h3>Facet</h3>`;
  const facetDefs = [
    ['draft', 'Draft',       i => i.is_draft],
    ['bot',   'Bot-authored',i => i.is_bot],
    ['conflicted','Conflicted', i => i.conflicted],
    ['bug',   'Bug',         i => i.type==='bug'],
    ['feature','Feature',    i => i.type==='feature'],
    ['docs',  'Docs',        i => i.type==='docs'],
  ];
  facetDefs.forEach(([k,lab,fn]) => { const n = DATA.filter(fn).length; if(!n) return;
    h += `<label class="frow"><input type="checkbox" data-g="facets" value="${k}">${lab}<span class="fc">${n}</span></label>`;
  });
  h += `<button class="clearbtn" id="clear">Clear filters</button>`;
  side.innerHTML = h;
  window.__facetFns = Object.fromEntries(facetDefs.map(([k,,fn]) => [k, fn]));
})();

function matches(i) {
  if (state.bins.size && !state.bins.has(i.bin)) return false;
  if (state.kinds.size && !state.kinds.has(i.kind)) return false;
  for (const f of state.facets) { if (!window.__facetFns[f](i)) return false; }
  if (state.term && !(`#${i.number} ${i.title} ${i.author} ${i.reason}`).toLowerCase().includes(state.term)) return false;
  return true;
}

function qitem(i) {
  const el = document.createElement('div'); el.className = 'qitem';
  const dueTag = pastDue(i) ? ` <span class="duegc">· ${i.idle}d past due</span>` : '';
  el.innerHTML = `
    <div class="qitem-h"><span class="num">#${i.number}</span>${facets(i)}<span class="ttl">${esc(i.title)}</span>
      <span class="age">${i.idle==null?'?':i.idle}d idle · ${i.age==null?'?':i.age}d old${dueTag}</span></div>
    <div class="qitem-body">
      <div class="rat">${esc(i.reason)}</div>
      <div class="line"><b>Rule:</b> <span class="rule">${esc(i.rule)}</span>${i.dup?` · <b>duplicate of</b> <a href="${esc(i.url)}">#${i.dup}</a>`:''}</div>
      <div class="line"><b>Labels:</b> ${(i.labels||[]).map(l=>`<code>${esc(l)}</code>`).join(' ')||'—'}</div>
      <div class="line"><a href="${esc(i.url)}">open #${i.number} ↗</a></div>
    </div>`;
  el.querySelector('.qitem-h').onclick = () => el.classList.toggle('open');
  return el;
}

function draw() {
  const items = DATA.filter(matches);
  main.innerHTML = '';
  if (!items.length) { main.innerHTML = '<div class="empty">No items match these filters.</div>'; return; }
  BINS.forEach(b => {
    const bi = items.filter(i => i.bin === b.key); if (!bi.length) return;
    const grp = document.createElement('div'); grp.className = 'grp'; grp.style.setProperty('--c', b.color);
    grp.innerHTML = `<div class="grp-h"><span class="binbadge"><span class="dot" style="background:${b.color}"></span>${b.label}</span><span class="cnt">${bi.length} item${bi.length>1?'s':''}</span></div>`;
    // nest duplicate clusters under their canonical number
    const cluster = {};
    bi.forEach(i => { const key = i.dup || i.number; (cluster[key] = cluster[key] || []).push(i); });
    Object.entries(cluster).forEach(([key, group]) => {
      const isDup = group.some(i => i.dup);
      const box = document.createElement('div');
      if (isDup) { box.className = 'dupgroup'; box.innerHTML = `<div class="caption">duplicate cluster → canonical #${key}</div>`; }
      group.forEach(i => box.appendChild(qitem(i)));
      grp.appendChild(box);
    });
    main.appendChild(grp);
  });
}

side.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = () => {
  const set = state[cb.dataset.g];
  cb.checked ? set.add(cb.value) : set.delete(cb.value);
  draw();
});
document.getElementById('q').oninput = e => { state.term = e.target.value.toLowerCase(); draw(); };
document.getElementById('clear').onclick = () => {
  state.bins.clear(); state.kinds.clear(); state.facets.clear(); state.term = '';
  side.querySelectorAll('input').forEach(x => { if (x.type==='checkbox') x.checked = false; else x.value = ''; });
  draw();
};
draw();
</script>
</body>
</html>
