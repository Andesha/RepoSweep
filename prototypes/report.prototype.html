<!DOCTYPE html>
<!--
  ============================================================================
  PROTOTYPE — RepoSweep HTML report  (wayfinder ticket #8)
  Throwaway. Answers: "What does the shareable report look like, and how hosted?"

  THREE radically different layouts over ONE shared mock dataset, switchable
  from the floating bar at the bottom (arrow keys ← → also work):
    A — Board     : one column per outcome-bin, cards you scan bin-by-bin
    B — Table     : dense sortable/filterable spreadsheet, built for hundreds
    C — Queue     : faceted sidebar + grouped accordion, work the backlog down

  Single self-contained file. No build step, no external runtime deps, no CDN.
  Real report would inline the run's verdicts.jsonl in place of MOCK below.
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoSweep report — Andesha/RepoSweep</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1f2430; --muted: #6b7280;
    --line: #e4e7ec; --line2: #eef1f4; --chip: #f1f3f6; --accent: #4338ca;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--sans); color: var(--ink); background: var(--bg); font-size: 14px; line-height: 1.45; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, .mono { font-family: var(--mono); }

  /* ---- shared top banner ---- */
  .banner { background: var(--panel); border-bottom: 1px solid var(--line); padding: 14px 20px; }
  .banner-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; max-width: 1400px; margin: 0 auto; }
  .banner h1 { font-size: 17px; margin: 0; font-weight: 650; }
  .banner .sub { color: var(--muted); font-size: 12.5px; }
  .banner .sub .mono { color: var(--ink); }
  .totals { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px auto 0; max-width: 1400px; }
  .total-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
    background: var(--chip); font-size: 12px; border: 1px solid var(--line); }
  .total-pill b { font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

  .view { display: none; }
  .view.active { display: block; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 16px 20px 90px; }

  /* facet chips reused everywhere */
  .facet { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: var(--chip);
    color: var(--muted); border: 1px solid var(--line); white-space: nowrap; text-transform: uppercase; letter-spacing: .02em; }
  .facet.bug { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
  .facet.feature { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
  .facet.docs { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
  .facet.gfi { background: #fdf4ff; color: #a21caf; border-color: #f5d0fe; }
  .facet.pr { background: #ecfeff; color: #0e7490; border-color: #a5f3fc; }
  .facet.draft { background: #f8fafc; color: #475569; border-color: #cbd5e1; }
  .facet.bot { background: #fffbeb; color: #b45309; border-color: #fde68a; }
  .facet.healthy { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
  .num { font-family: var(--mono); color: var(--muted); font-size: 12px; }
  .binbadge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; }

  /* ============ VARIANT A — BOARD ============ */
  #view-A .board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; }
  .col { flex: 0 0 275px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  .col-h { padding: 10px 12px; border-bottom: 1px solid var(--line2); border-top: 3px solid var(--c); border-radius: 10px 10px 0 0;
    display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; }
  .col-h .binbadge { color: var(--c); }
  .col-h .cnt { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .col-body { padding: 8px; display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 240px); overflow-y: auto; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; background: #fff; cursor: pointer; }
  .card:hover { border-color: #c7cdd6; }
  .card .ttl { font-weight: 550; font-size: 13px; margin: 3px 0 4px; }
  .card .meta { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .card .rat { display: none; margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 12px; }
  .card.open .rat { display: block; }
  .card .age { margin-left: auto; font-size: 11px; color: var(--muted); }
  .card.dup-child { margin-left: 14px; border-left: 3px solid #f9a8d4; }

  /* ============ VARIANT B — TABLE ============ */
  #view-B .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .search { flex: 1 1 240px; min-width: 200px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; background: #fff; }
  select.filter { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 13px; }
  .tablewrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); }
  table { border-collapse: collapse; width: 100%; }
  thead th { position: sticky; top: 0; background: #fbfbfd; text-align: left; font-size: 11.5px; text-transform: uppercase;
    letter-spacing: .03em; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; white-space: nowrap; }
  thead th .arw { opacity: .5; font-size: 10px; }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--line2); vertical-align: top; }
  tbody tr:hover { background: #fafbff; }
  tbody tr.row { cursor: pointer; }
  td.c-num { white-space: nowrap; }
  td.c-title { max-width: 420px; }
  td.c-title .t { font-weight: 550; }
  td.c-bin { white-space: nowrap; }
  td.c-age { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
  tr.detail td { background: #fbfcfe; border-bottom: 1px solid var(--line); padding: 0 12px; }
  tr.detail .inner { padding: 10px 2px 14px; display: none; }
  tr.detail.show .inner { display: block; }
  tr.detail .rat { color: #374151; }
  tr.detail .lbls { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .lbl { font-family: var(--mono); font-size: 11px; background: var(--chip); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
  .empty { color: var(--muted); padding: 30px; text-align: center; }

  /* ============ VARIANT C — QUEUE ============ */
  #view-C .queue { display: grid; grid-template-columns: 240px 1fr; gap: 18px; align-items: start; }
  .side { position: sticky; top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 12px; }
  .side h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; }
  .side h3:first-of-type { margin-top: 6px; }
  .side .search { width: 100%; margin-bottom: 4px; }
  .frow { display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .frow:hover { background: var(--line2); }
  .frow input { accent-color: var(--accent); }
  .frow .fc { margin-left: auto; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .frow .dot { margin: 0; }
  .side .clearbtn { margin-top: 12px; width: 100%; padding: 6px; border: 1px solid var(--line); background: #fff; border-radius: 7px; font-size: 12px; cursor: pointer; color: var(--muted); }
  .grp { margin-bottom: 16px; }
  .grp-h { display: flex; align-items: center; gap: 8px; padding: 6px 2px; border-bottom: 2px solid var(--c); margin-bottom: 6px; }
  .grp-h .binbadge { color: var(--c); font-size: 13.5px; }
  .grp-h .cnt { color: var(--muted); font-size: 12px; }
  .qitem { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; margin-bottom: 7px; }
  .qitem-h { padding: 9px 12px; display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .qitem-h .ttl { font-weight: 550; }
  .qitem-h .age { margin-left: auto; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .qitem-body { display: none; padding: 0 12px 12px 12px; color: #374151; }
  .qitem.open .qitem-body { display: block; }
  .qitem .rat { border-top: 1px dashed var(--line); padding-top: 9px; }
  .qitem .dupline { margin-top: 8px; font-size: 12.5px; }
  .dupgroup { border-left: 3px solid #f9a8d4; padding-left: 10px; margin: 6px 0 10px; }
  .dupgroup .caption { font-size: 11.5px; color: #be185d; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .03em; }

  /* ---- floating switcher ---- */
  .switch { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 50;
    display: flex; align-items: center; gap: 4px; background: #111827; color: #fff; border-radius: 999px;
    padding: 5px 6px; box-shadow: 0 8px 24px rgba(0,0,0,.25); font-size: 13px; }
  .switch button { background: transparent; border: 0; color: #fff; cursor: pointer; font-size: 15px; padding: 4px 9px; border-radius: 999px; }
  .switch button:hover { background: rgba(255,255,255,.14); }
  .switch .label { padding: 0 8px; min-width: 150px; text-align: center; font-weight: 550; }
  .switch .label small { color: #9ca3af; font-weight: 400; }
  .switch .tag { position: absolute; top: -9px; left: 12px; background: #f59e0b; color: #1f2937; font-size: 9px; font-weight: 700;
    padding: 1px 6px; border-radius: 999px; text-transform: uppercase; letter-spacing: .05em; }
</style>
</head>
<body>

<div class="banner">
  <div class="banner-row">
    <h1>RepoSweep — <span class="mono">Andesha/RepoSweep</span></h1>
    <span class="sub">run <span class="mono">2026-09-03T14:22:07Z</span> · <span class="mono" id="s-count"></span> open items swept · propose-only, nothing written back</span>
  </div>
  <div class="totals" id="totals"></div>
</div>

<!-- ========== VARIANT A — BOARD ========== -->
<section id="view-A" class="view">
  <div class="wrap"><div class="board" id="board"></div></div>
</section>

<!-- ========== VARIANT B — TABLE ========== -->
<section id="view-B" class="view">
  <div class="wrap">
    <div class="toolbar">
      <input class="search" id="b-search" placeholder="Search title, #number, author, rationale…">
      <select class="filter" id="b-bin"><option value="">All bins</option></select>
      <select class="filter" id="b-kind"><option value="">Issues + PRs</option><option value="issue">Issues only</option><option value="pr">PRs only</option></select>
      <span class="num" id="b-shown"></span>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th data-k="number">#<span class="arw"></span></th>
          <th data-k="kind">Kind<span class="arw"></span></th>
          <th data-k="title">Title<span class="arw"></span></th>
          <th data-k="type">Type<span class="arw"></span></th>
          <th data-k="bin">Suggested outcome<span class="arw"></span></th>
          <th data-k="age">Age<span class="arw"></span></th>
          <th data-k="updated">Idle<span class="arw"></span></th>
        </tr></thead>
        <tbody id="b-body"></tbody>
      </table>
    </div>
  </div>
</section>

<!-- ========== VARIANT C — QUEUE ========== -->
<section id="view-C" class="view">
  <div class="wrap">
    <div class="queue">
      <aside class="side" id="c-side"></aside>
      <div id="c-main"></div>
    </div>
  </div>
</section>

<!-- ========== floating switcher ========== -->
<div class="switch">
  <span class="tag">Prototype</span>
  <button id="sw-prev" aria-label="previous">←</button>
  <span class="label" id="sw-label"></span>
  <button id="sw-next" aria-label="next">→</button>
</div>

<script>
/* ============================================================================
   MOCK DATA — stands in for the run's verdicts.jsonl (would be inlined here).
   Fields mirror the locked taxonomy: bin == suggested outcome (#5/#6),
   duplicate_of scalar (#7), issue/PR/draft/bot facets, type + good-first.
   ========================================================================== */
const BINS = [
  { key:'ready-for-agent',    label:'Ready for agent',    color:'#7c3aed', scope:'issue' },
  { key:'ready-for-human',    label:'Ready for human',    color:'#2563eb', scope:'issue' },
  { key:'needs-rebase',       label:'Needs rebase',       color:'#d97706', scope:'pr' },
  { key:'flag-for-review',    label:'Flag for review',    color:'#0891b2', scope:'pr' },
  { key:'needs-info',         label:'Needs info',         color:'#ca8a04', scope:'both' },
  { key:'possible-duplicate', label:'Possible duplicate', color:'#db2777', scope:'both' },
  { key:'close-as-stale',     label:'Close as stale',     color:'#dc2626', scope:'both' },
  { key:'wontfix',            label:'Wontfix',            color:'#6b7280', scope:'both' },
  { key:'needs-triage',       label:'Needs triage',       color:'#64748b', scope:'both' },
];
const BINMAP = Object.fromEntries(BINS.map(b => [b.key, b]));

const ITEMS = [
  // ---- issues ----
  { number:412, kind:'issue', title:'App crashes on startup when config file is missing', author:'rgomez', type:'bug', gfi:false, bin:'ready-for-agent', age:9, updated:2, dup:null, labels:['type:bug','status:accepted'], rationale:'Clear repro, minimal surface, no maintainer decision needed → agent can pick up.' },
  { number:398, kind:'issue', title:'Typo in README installation section ("intall")', author:'priya-k', type:'docs', gfi:true, bin:'ready-for-agent', age:14, updated:14, dup:null, labels:['type:docs','good-first-issue'], rationale:'Docs one-liner, good-first-issue signal present. Trivial, well-specified.' },
  { number:377, kind:'issue', title:'Add --json flag to the sweep command output', author:'devon', type:'feature', gfi:false, bin:'ready-for-agent', age:22, updated:6, dup:null, labels:['type:feature','status:accepted'], rationale:'Scope agreed in thread; mechanical to implement against existing output layer.' },
  { number:355, kind:'issue', title:'Support custom staleness windows per label', author:'mira', type:'feature', gfi:false, bin:'ready-for-human', age:31, updated:12, dup:null, labels:['type:feature'], rationale:'Design decision (config surface) unresolved — needs a maintainer call before build.' },
  { number:340, kind:'issue', title:'Should we drop Node 16 support?', author:'lee', type:null, gfi:false, bin:'ready-for-human', age:40, updated:20, dup:null, labels:['discussion'], rationale:'Policy question with tradeoffs; a human owner must decide, not an agent.' },
  { number:333, kind:'issue', title:'Feature request: Slack integration for reports', author:'omar', type:'feature', gfi:false, bin:'ready-for-human', age:52, updated:33, dup:null, labels:['type:feature'], rationale:'Sizable new surface; roadmap fit is a maintainer judgement.' },
  { number:301, kind:'issue', title:'Reporter cannot reproduce — intermittent hang', author:'anon-user', type:'bug', gfi:false, bin:'needs-info', age:26, updated:9, dup:null, labels:['type:bug','needs-info'], rationale:'Idle 9d past the 7d needs-info window; no repro steps, no version. Blocked on reporter.' },
  { number:288, kind:'issue', title:'Colors unreadable — but which theme?', author:'sam', type:'bug', gfi:false, bin:'needs-info', age:35, updated:15, dup:null, labels:['type:bug','needs-info'], rationale:'Missing environment detail; idle beyond 7d needs-info threshold.' },
  { number:270, kind:'issue', title:'Crash on startup with empty config', author:'wei', type:'bug', gfi:false, bin:'possible-duplicate', age:44, updated:30, dup:412, labels:['type:bug'], rationale:'Semantic match to #412 (same crash, same cause). Newer → duplicate of canonical #412.' },
  { number:264, kind:'issue', title:'Startup failure: config not found', author:'jordan', type:'bug', gfi:false, bin:'possible-duplicate', age:47, updated:41, dup:412, labels:['type:bug'], rationale:'Title+body overlap with #412; two significant shared tokens, confirmed by dedup pass.' },
  { number:255, kind:'issue', title:'Please add a dark mode', author:'kayla', type:'feature', gfi:false, bin:'possible-duplicate', age:61, updated:55, dup:333, labels:['type:feature'], rationale:'Overlaps a broader request; dedup pass links to lower-numbered canonical.' },
  { number:210, kind:'issue', title:'Old build instructions no longer work', author:'ghost-acct', type:'docs', gfi:false, bin:'close-as-stale', age:190, updated:150, dup:null, labels:['type:docs'], rationale:'Idle 150d ≫ 60d stale threshold; superseded by rewritten docs. Not queued.' },
  { number:188, kind:'issue', title:'Question: is this compatible with GitLab?', author:'tomas', type:null, gfi:false, bin:'close-as-stale', age:220, updated:118, dup:null, labels:['question'], rationale:'Answered in thread, idle 118d, no follow-up. Past stale window.' },
  { number:150, kind:'issue', title:'Rewrite everything in Rust', author:'hotcoal', type:null, gfi:false, bin:'wontfix', age:240, updated:70, dup:null, labels:['wontfix'], rationale:'Maintainer declined in thread; out of project scope. First-match: wontfix.' },
  { number:142, kind:'issue', title:'Add telemetry to track usage', author:'metricsfan', type:'feature', gfi:false, bin:'wontfix', age:255, updated:80, dup:null, labels:['type:feature','wontfix'], rationale:'Conflicts with stated privacy posture; explicitly declined.' },
  { number:120, kind:'issue', title:'Weird behavior sometimes', author:'newbie', type:null, gfi:false, bin:'needs-triage', age:5, updated:5, dup:null, labels:[], rationale:'No type, no clear ask, too fresh for stale — nothing mechanical fires. Holds for human eyes.' },
  { number:118, kind:'issue', title:'Improve performance of the classifier', author:'ada', type:null, gfi:false, bin:'needs-triage', age:12, updated:8, dup:null, labels:['performance'], rationale:'Underspecified scope; no ladder rule matches. Parked in the holding pen.' },
  { number:405, kind:'issue', title:'Grammar fixes across docs/ folder', author:'wordsmith', type:'docs', gfi:true, bin:'ready-for-agent', age:7, updated:3, dup:null, labels:['type:docs','good-first-issue'], rationale:'Bounded docs cleanup, good-first-issue. Agent-ready.' },
  { number:360, kind:'issue', title:'Cannot install on Windows — path error', author:'winuser', type:'bug', gfi:false, bin:'ready-for-human', age:29, updated:11, dup:null, labels:['type:bug'], rationale:'Platform support scope decision precedes any fix.' },
  { number:245, kind:'issue', title:'Duplicate of the dark mode thing', author:'echo', type:'feature', gfi:false, bin:'possible-duplicate', age:70, updated:60, dup:333, labels:['type:feature'], rationale:'Self-described duplicate; links to canonical #333.' },

  // ---- PRs ----
  { number:409, kind:'pr', title:'Fix null deref in title tokenizer', author:'rgomez', type:null, gfi:false, draft:false, bot:false, healthy:true, size:'small', merge:'clean', bin:'flag-for-review', age:4, updated:1, dup:null, labels:['size/S'], rationale:'Small (18 LOC, 2 files), clean merge, fresh. Not silent-closeable → surfaced for a reviewer.' },
  { number:401, kind:'pr', title:'WIP: rewrite auth module', author:'devon', type:null, gfi:false, draft:true, bot:false, healthy:true, size:'large', merge:'clean', bin:'flag-for-review', age:18, updated:5, dup:null, labels:['size/XL'], rationale:'Draft, large (~800 LOC). Active (idle 5d) but needs a human look. Draft noted as facet.' },
  { number:388, kind:'pr', title:'Add tests for the utils package', author:'priya-k', type:null, gfi:false, draft:false, bot:false, healthy:false, size:'medium', merge:'behind', bin:'needs-rebase', age:24, updated:6, dup:null, labels:['size/M'], rationale:'mergeable_state=behind (base moved). Fresh otherwise — ask author to rebase.' },
  { number:372, kind:'pr', title:'Refactor report renderer', author:'mira', type:null, gfi:false, draft:false, bot:false, healthy:false, size:'large', merge:'dirty', bin:'needs-rebase', age:33, updated:15, dup:null, labels:['size/L'], rationale:'mergeable_state=dirty (conflicts), but still within stale window → rebase, not close.' },
  { number:340, kind:'pr', title:'Tiny fix: trailing whitespace', author:'ghost-acct', type:null, gfi:false, draft:false, bot:false, healthy:false, size:'small', merge:'clean', bin:'close-as-stale', age:130, updated:95, dup:null, labels:['size/XS'], rationale:'Small (<30 LOC, ≤3 files) + clean + idle 95d > 60d. Low-cost to close as stale.' },
  { number:322, kind:'pr', title:'Old experimental caching layer', author:'lee', type:null, gfi:false, draft:false, bot:false, healthy:false, size:'large', merge:'dirty', bin:'flag-for-review', age:210, updated:140, dup:null, labels:['size/XL'], rationale:'Large + conflicted + idle 140d. Big & old is never silent-closed → flagged for a human.' },
  { number:415, kind:'pr', title:'Bump lodash from 4.17.20 to 4.17.21', author:'dependabot[bot]', type:null, gfi:false, draft:false, bot:true, healthy:true, size:'small', merge:'clean', bin:'needs-triage', age:3, updated:3, dup:null, labels:['dependencies'], rationale:'Bot PR, clean & fresh, no rule fires. Healthy=true; bot noted as facet. Human decides merge cadence.' },
  { number:300, kind:'pr', title:'Implement CSV export (supersedes older PR)', author:'omar', type:null, gfi:false, draft:false, bot:false, healthy:false, size:'medium', merge:'clean', bin:'possible-duplicate', age:60, updated:40, dup:372, labels:['size/M'], rationale:'Overlaps #372 in intent; dedup pass links newer → canonical.' },
  { number:280, kind:'pr', title:'Fix flaky test (no description)', author:'anon-user', type:null, gfi:false, draft:false, bot:false, healthy:false, size:'small', merge:'clean', bin:'needs-info', age:40, updated:20, dup:null, labels:[], rationale:'No description, no linked issue; idle past needs-info window. Ask author what it fixes.' },
];

/* -------- derive counts + wire selects -------- */
document.getElementById('s-count').textContent = ITEMS.length;
const byBin = k => ITEMS.filter(i => i.bin === k);
const totals = document.getElementById('totals');
BINS.forEach(b => {
  const n = byBin(b.key).length; if (!n) return;
  const el = document.createElement('span');
  el.className = 'total-pill';
  el.innerHTML = `<span class="dot" style="background:${b.color}"></span><span>${b.label}</span><b>${n}</b>`;
  totals.appendChild(el);
});

/* facet chips helper */
function facets(i) {
  const f = [];
  f.push(`<span class="facet ${i.kind==='pr'?'pr':''}">${i.kind==='pr'?'PR':'ISSUE'}</span>`);
  if (i.type) f.push(`<span class="facet ${i.type}">${i.type}</span>`);
  if (i.gfi) f.push(`<span class="facet gfi">good-first</span>`);
  if (i.draft) f.push(`<span class="facet draft">draft</span>`);
  if (i.bot) f.push(`<span class="facet bot">bot</span>`);
  if (i.kind==='pr' && i.healthy) f.push(`<span class="facet healthy">healthy</span>`);
  if (i.kind==='pr' && i.size) f.push(`<span class="facet">size/${i.size}</span>`);
  return f.join('');
}
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ================= VARIANT A — BOARD ================= */
(function renderBoard(){
  const board = document.getElementById('board');
  BINS.forEach(b => {
    const items = byBin(b.key);
    const col = document.createElement('div');
    col.className = 'col'; col.style.setProperty('--c', b.color);
    col.innerHTML = `<div class="col-h"><span class="binbadge"><span class="dot" style="background:${b.color}"></span>${b.label}</span><span class="cnt">${items.length}</span></div>`;
    const body = document.createElement('div'); body.className = 'col-body';
    // canonical first, dup children indented beneath their canonical if same bin
    items.forEach(i => {
      const card = document.createElement('div');
      card.className = 'card' + (i.dup ? ' dup-child' : '');
      card.innerHTML = `
        <div class="meta"><span class="num">#${i.number}</span>${facets(i)}<span class="age">${i.updated}d idle</span></div>
        <div class="ttl">${esc(i.title)}</div>
        ${i.dup ? `<div class="meta"><span class="num">↳ dup of #${i.dup}</span></div>` : ''}
        <div class="rat">${esc(i.rationale)}</div>`;
      card.onclick = () => card.classList.toggle('open');
      body.appendChild(card);
    });
    if (!items.length) body.innerHTML = '<div class="empty" style="padding:14px;font-size:12px">— none —</div>';
    col.appendChild(body); board.appendChild(col);
  });
})();

/* ================= VARIANT B — TABLE ================= */
(function renderTable(){
  const binSel = document.getElementById('b-bin');
  BINS.forEach(b => { const o=document.createElement('option'); o.value=b.key; o.textContent=b.label; binSel.appendChild(o); });
  const body = document.getElementById('b-body');
  const shown = document.getElementById('b-shown');
  let sortK = 'number', sortDir = 1;
  const q = () => document.getElementById('b-search').value.toLowerCase();

  function rows() {
    let r = ITEMS.slice();
    const kind = document.getElementById('b-kind').value;
    const bin = binSel.value;
    const term = q();
    if (kind) r = r.filter(i => i.kind === kind);
    if (bin) r = r.filter(i => i.bin === bin);
    if (term) r = r.filter(i => (`#${i.number} ${i.title} ${i.author} ${i.rationale}`).toLowerCase().includes(term));
    r.sort((a,b) => {
      let x=a[sortK], y=b[sortK];
      if (sortK==='bin') { x=BINS.findIndex(z=>z.key===a.bin); y=BINS.findIndex(z=>z.key===b.bin); }
      return (x>y?1:x<y?-1:0) * sortDir;
    });
    return r;
  }
  function draw() {
    const r = rows();
    shown.textContent = `${r.length} of ${ITEMS.length} shown`;
    body.innerHTML = '';
    if (!r.length) { body.innerHTML = '<tr><td colspan="7" class="empty">No items match.</td></tr>'; return; }
    r.forEach(i => {
      const b = BINMAP[i.bin];
      const tr = document.createElement('tr'); tr.className='row';
      tr.innerHTML = `
        <td class="c-num"><span class="num">#${i.number}</span></td>
        <td><span class="facet ${i.kind==='pr'?'pr':''}">${i.kind==='pr'?'PR':'issue'}</span></td>
        <td class="c-title"><span class="t">${esc(i.title)}</span> ${i.dup?`<span class="num">· dup of #${i.dup}</span>`:''}</td>
        <td>${i.type?`<span class="facet ${i.type}">${i.type}</span>`:'<span class="num">—</span>'}</td>
        <td class="c-bin"><span class="binbadge" style="color:${b.color}"><span class="dot" style="background:${b.color}"></span>${b.label}</span></td>
        <td class="c-age">${i.age}d</td>
        <td class="c-age">${i.updated}d</td>`;
      const det = document.createElement('tr'); det.className='detail';
      det.innerHTML = `<td colspan="7"><div class="inner"><div class="rat">${esc(i.rationale)}</div>
        <div class="lbls">${facets(i)}${i.labels.map(l=>`<span class="lbl">${esc(l)}</span>`).join('')}
        <a class="lbl" href="#" onclick="return false">open #${i.number} ↗</a></div></div></td>`;
      tr.onclick = () => det.classList.toggle('show');
      body.appendChild(tr); body.appendChild(det);
    });
  }
  document.querySelectorAll('#view-B thead th').forEach(th => th.onclick = () => {
    const k = th.dataset.k; if (sortK===k) sortDir*=-1; else { sortK=k; sortDir=1; }
    document.querySelectorAll('#view-B thead .arw').forEach(a=>a.textContent='');
    th.querySelector('.arw').textContent = sortDir>0?'▲':'▼';
    draw();
  });
  document.getElementById('b-search').oninput = draw;
  binSel.onchange = draw;
  document.getElementById('b-kind').onchange = draw;
  draw();
})();

/* ================= VARIANT C — QUEUE ================= */
(function renderQueue(){
  const side = document.getElementById('c-side');
  const main = document.getElementById('c-main');
  const state = { bins: new Set(), kinds: new Set(), term: '' };

  // sidebar
  let html = `<input class="search" id="c-search" placeholder="Search…">`;
  html += `<h3>Outcome bin</h3>`;
  BINS.forEach(b => { const n=byBin(b.key).length; if(!n) return;
    html += `<label class="frow"><input type="checkbox" data-bin="${b.key}"><span class="dot" style="background:${b.color}"></span>${b.label}<span class="fc">${n}</span></label>`;
  });
  html += `<h3>Kind</h3>`;
  ['issue','pr'].forEach(k => { const n=ITEMS.filter(i=>i.kind===k).length;
    html += `<label class="frow"><input type="checkbox" data-kind="${k}">${k==='pr'?'Pull requests':'Issues'}<span class="fc">${n}</span></label>`;
  });
  html += `<button class="clearbtn" id="c-clear">Clear filters</button>`;
  side.innerHTML = html;

  function draw() {
    let items = ITEMS.filter(i => {
      if (state.bins.size && !state.bins.has(i.bin)) return false;
      if (state.kinds.size && !state.kinds.has(i.kind)) return false;
      if (state.term && !(`#${i.number} ${i.title} ${i.author} ${i.rationale}`).toLowerCase().includes(state.term)) return false;
      return true;
    });
    main.innerHTML = '';
    if (!items.length) { main.innerHTML = '<div class="empty">No items match these filters.</div>'; return; }
    BINS.forEach(b => {
      const bi = items.filter(i => i.bin === b.key); if (!bi.length) return;
      const grp = document.createElement('div'); grp.className='grp'; grp.style.setProperty('--c', b.color);
      grp.innerHTML = `<div class="grp-h"><span class="binbadge"><span class="dot" style="background:${b.color}"></span>${b.label}</span><span class="cnt">${bi.length} item${bi.length>1?'s':''}</span></div>`;
      // group duplicates under their canonical
      const canon = {};
      bi.forEach(i => { const key = i.dup || i.number; (canon[key]=canon[key]||[]).push(i); });
      Object.entries(canon).forEach(([key, group]) => {
        const isDupCluster = group.some(i => i.dup) ;
        const wrapEl = document.createElement('div');
        if (isDupCluster) { wrapEl.className='dupgroup'; wrapEl.innerHTML = `<div class="caption">duplicate cluster → canonical #${key}</div>`; }
        group.forEach(i => wrapEl.appendChild(qitem(i, b)));
        grp.appendChild(wrapEl);
      });
      main.appendChild(grp);
    });
  }
  function qitem(i, b) {
    const el = document.createElement('div'); el.className='qitem';
    el.innerHTML = `
      <div class="qitem-h"><span class="num">#${i.number}</span>${facets(i)}<span class="ttl">${esc(i.title)}</span><span class="age">${i.updated}d idle · ${i.age}d old</span></div>
      <div class="qitem-body">
        <div class="rat">${esc(i.rationale)}</div>
        ${i.dup?`<div class="dupline"><b>Suggested:</b> mark as <code>possible-duplicate of #${i.dup}</code></div>`:''}
        <div class="dupline"><b>Labels:</b> ${i.labels.map(l=>`<code>${esc(l)}</code>`).join(' ')||'—'}</div>
      </div>`;
    el.querySelector('.qitem-h').onclick = () => el.classList.toggle('open');
    return el;
  }
  side.querySelectorAll('input[data-bin]').forEach(cb => cb.onchange = () => { cb.checked?state.bins.add(cb.dataset.bin):state.bins.delete(cb.dataset.bin); draw(); });
  side.querySelectorAll('input[data-kind]').forEach(cb => cb.onchange = () => { cb.checked?state.kinds.add(cb.dataset.kind):state.kinds.delete(cb.dataset.kind); draw(); });
  document.getElementById('c-search').oninput = e => { state.term = e.target.value.toLowerCase(); draw(); };
  document.getElementById('c-clear').onclick = () => { state.bins.clear(); state.kinds.clear(); state.term=''; side.querySelectorAll('input').forEach(x=>{if(x.type==='checkbox')x.checked=false; else x.value='';}); draw(); };
  draw();
})();

/* ================= SWITCHER ================= */
const VARIANTS = [
  { k:'A', name:'Board — scan bin-by-bin' },
  { k:'B', name:'Table — dense, sortable' },
  { k:'C', name:'Queue — faceted sidebar' },
];
function show(k) {
  const v = VARIANTS.find(x=>x.k===k) || VARIANTS[0];
  document.querySelectorAll('.view').forEach(s => s.classList.remove('active'));
  document.getElementById('view-'+v.k).classList.add('active');
  document.getElementById('sw-label').innerHTML = `${v.k} <small>· ${v.name.split(' — ')[1]}</small>`;
  if (location.hash !== '#'+v.k) history.replaceState(null,'','#'+v.k);
}
function cycle(d) {
  const cur = (location.hash.slice(1) || 'A');
  let idx = VARIANTS.findIndex(x=>x.k===cur); if (idx<0) idx=0;
  idx = (idx + d + VARIANTS.length) % VARIANTS.length;
  show(VARIANTS[idx].k);
}
document.getElementById('sw-prev').onclick = () => cycle(-1);
document.getElementById('sw-next').onclick = () => cycle(1);
window.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
  if (e.key==='ArrowLeft') cycle(-1);
  if (e.key==='ArrowRight') cycle(1);
});
show(location.hash.slice(1) || 'A');
</script>
